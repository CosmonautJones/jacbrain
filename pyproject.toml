[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacbrain"
version = "0.1.0"
description = "Versioned engineering context and compiler-evidenced memory for Jac"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Travis Jones"}]
dependencies = []

[project.optional-dependencies]
benchmark = ["tiktoken==0.12.0"]

[project.scripts]
jacbrain = "jacbrain.__main__:main"

[tool.setuptools.packages.find]
include = ["jacbrain*"]
